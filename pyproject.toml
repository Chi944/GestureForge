[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gestureforge"
version = "0.1.0"
description = "Personal gesture recognition assignment prototype"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "scikit-learn", "opencv-contrib-python", "mediapipe", "PySide6"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["gestureforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
