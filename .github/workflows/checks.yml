name: Assignment checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build and extract the laptop source package
        run: |
          python scripts/package_release.py
          Expand-Archive -LiteralPath releases/gestureforge-assignment-source.zip -DestinationPath '.cache/Windows Laptop Smoke'
      - name: Set up the extracted package with Windows PowerShell
        working-directory: .cache/Windows Laptop Smoke/gestureforge
        run: |
          $pythonExe = (Get-Command python).Source
          .\setup.cmd -PythonExe "$pythonExe"
      - name: Verify dependencies, model, software and launcher from the archive
        working-directory: .cache/Windows Laptop Smoke/gestureforge
        run: |
          .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/check_environment.py --model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\run.cmd --smoke-test
